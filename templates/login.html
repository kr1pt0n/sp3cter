<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>👻 Sp3cter | Login</title>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { background: #1a1a1a; padding: 40px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.8); width: 350px; text-align: center; }
        h2 { color: #5dade2; font-size: 1.5rem; margin-bottom: 25px; }
        input { width: 100%; background: #000; border: 1px solid #444; border-radius: 8px; color: #fff; padding: 12px; margin-bottom: 20px; outline: none; }
        input:focus { border-color: #5dade2; box-shadow: 0 0 8px #5dade2; }
        button { width: 100%; background: linear-gradient(to bottom, #5dade2, #2e86c1); border: none; padding: 12px; color: white; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .error { color: #ff4444; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>👻 SP3CTER LOGIN</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Access Password" required autofocus>
            <button type="submit">AUTHORIZE</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sp3cter | Login Secure Access</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b141d;
            --panel-color: #121d27;
            --input-bg: #1a252f;
            --text-muted: #7f95a6;
            --gradient-start: #3ba7a8;
            --gradient-end: #8e3c63;
        }

        body {
            background: var(--bg-color);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-box {
            background: var(--panel-color);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 340px;
            text-align: left;
        }

        /* Estilos para la imagen centrada */
        .login-logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 100px; /* Puedes ajustar este tamaño */
            height: auto;
        }

        h2 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #fff;
            text-transform: uppercase;
            text-align: center; /* Centrado para alinear con la imagen */
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        input::placeholder {
            color: rgba(255,255,255,0.15);
        }

        button {
            width: 100%;
            background: linear-gradient(90deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            border: none;
            padding: 14px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .error {
            color: #ff4444;
            font-size: 0.75rem;
            margin-bottom: 15px;
            background: rgba(255, 68, 68, 0.05);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <!-- Imagen insertada y centrada -->
        <img src="{{ url_for('static', filename='baner.png') }}" alt="Logo" class="login-logo">
        <h2>AUTHENTICATION</h2>

        {% if error %}
        <div class="error">CREDENTIALS_INVALID</div>
        {% endif %}

        <form method="POST">
            <label>ACCESS KEY</label>
            <input type="password" name="password" placeholder="cite: (e.g., *********)" required autofocus>
            <button type="submit">Authorize Session</button>
        </form>
    </div>
</body>
</html>
